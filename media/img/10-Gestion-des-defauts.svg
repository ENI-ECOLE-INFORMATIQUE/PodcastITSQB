<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a52"/>
      <stop offset="1" stop-color="#0f1220"/>
    </linearGradient>
    <radialGradient id="glow-o" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-v" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.30"/>
