<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a52"/>
      <stop offset="1" stop-color="#0f1220"/>
    </linearGradient>
    <radialGradient id="glow-o" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-v" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="240" cy="140" r="420" fill="url(#glow-o)"/>
  <circle cx="1450" cy="800" r="520" fill="url(#glow-v)"/>

  <text x="1580" y="850" text-anchor="end" font-size="560" font-weight="800" fill="#ffffff" opacity="0.05">12</text>

  <rect x="110" y="280" width="300" height="300" rx="40" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent)" stroke-width="3"/>

  <!-- Checklist icon -->
  <rect x="140" y="290" width="240" height="280" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
  <g>
    <circle cx="185" cy="352" r="17" fill="url(#accent)"/>
    <path d="M 177 352 l 5 6 l 11 -13" fill="none" stroke="#16192b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="216" y="344" width="136" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.28"/>

    <circle cx="185" cy="432" r="17" fill="url(#accent)"/>
    <path d="M 177 432 l 5 6 l 11 -13" fill="none" stroke="#16192b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="216" y="424" width="136" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.28"/>

    <circle cx="185" cy="512" r="17" fill="url(#accent)"/>
    <path d="M 177 512 l 5 6 l 11 -13" fill="none" stroke="#16192b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="216" y="504" width="136" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.28"/>
  </g>

  <text x="470" y="365" font-size="34" font-weight="700" letter-spacing="6" fill="#ff8a3d">PODCASTS ISTQB · ÉPISODE 12</text>
  <text x="470" y="455" font-size="78" font-weight="800" fill="#ffffff">Récapitulatif final</text>
  <text x="470" y="520" font-size="36" fill="#9aa3c0">Tout relier pour réussir l'examen</text>
  <text x="110" y="840" font-size="26" fill="#ffffff" opacity="0.45">ENI École Informatique · RTL03</text>

  <rect x="0" y="880" width="1600" height="20" fill="url(#accent)"/>
