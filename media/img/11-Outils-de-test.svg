<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a52"/>
      <stop offset="1" stop-color="#0f1220"/>
    </linearGradient>
    <radialGradient id="glow-o" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-v" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="240" cy="140" r="420" fill="url(#glow-o)"/>
  <circle cx="1450" cy="800" r="520" fill="url(#glow-v)"/>

  <text x="1580" y="850" text-anchor="end" font-size="560" font-weight="800" fill="#ffffff" opacity="0.05">11</text>

  <rect x="110" y="280" width="300" height="300" rx="40" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent)" stroke-width="3"/>

  <!-- Gear icon -->
  <g fill="url(#accent)">
    <g transform="translate(245 450)">
      <rect x="-14" y="-132" width="28" height="46" rx="8"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(45)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(90)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(135)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(180)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(225)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(270)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="92"/>
    </g>
    <g transform="translate(362 322) scale(0.55)">
      <rect x="-14" y="-132" width="28" height="46" rx="8"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(45)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(90)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(135)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(180)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(225)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(270)"/>
      <rect x="-14" y="-132" width="28" height="46" rx="8" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="92"/>
    </g>
  </g>
  <circle cx="245" cy="450" r="40" fill="#171b2e"/>
  <circle cx="362" cy="322" r="22" fill="#171b2e"/>

  <text x="470" y="365" font-size="34" font-weight="700" letter-spacing="6" fill="#ff8a3d">PODCASTS ISTQB · ÉPISODE 11</text>
  <text x="470" y="455" font-size="78" font-weight="800" fill="#ffffff">Outils de test</text>
  <text x="470" y="520" font-size="36" fill="#9aa3c0">Automatisation, CI/CD et gestion de tests</text>
  <text x="110" y="840" font-size="26" fill="#ffffff" opacity="0.45">ENI École Informatique · RTL03</text>

  <rect x="0" y="880" width="1600" height="20" fill="url(#accent)"/>
</svg>
